services:
  - type: web
    name: riego-iot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PANEL_CLAVE
        sync: false
      - key: SECRET_KEY
        generateValue: true
